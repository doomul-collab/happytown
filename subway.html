<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지하철역 전화걸기</title>
<style>
  :root{
    --ink:#1b1f24;
    --sub:#6b7280;
    --line:#e5e7eb;
    --bg:#f7f7f5;
    --card:#ffffff;
    --accent:#0052A4;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:28px 20px 16px;
    background:linear-gradient(180deg,#101418 0%,#1b2028 100%);
    color:#fff;
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{
    margin:0 0 4px;
    font-size:21px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:13px;
    color:#9aa3af;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-top:16px;
    background:rgba(255,255,255,0.08);
    padding:4px;
    border-radius:12px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    color:#c3c9d1;
    font-size:14px;
    font-weight:700;
    padding:10px 0;
    border-radius:9px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .tab-btn.active{
    background:#fff;
    color:#101418;
  }
  main{
    flex:1;
    padding:16px 16px 40px;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  /* 검색 패널 */
  .search-box{
    position:relative;
    margin-bottom:14px;
  }
  .search-box input{
    width:100%;
    padding:14px 44px 14px 16px;
    font-size:16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:var(--card);
    outline:none;
    color:var(--ink);
  }
  .search-box input:focus{
    border-color:var(--accent);
  }
  .search-box .clear{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:#d8dadd;
    color:#fff;
    width:24px;
    height:24px;
    border-radius:50%;
    font-size:14px;
    line-height:24px;
    text-align:center;
    cursor:pointer;
    display:none;
  }
  .hint{
    font-size:13px;
    color:var(--sub);
    margin:0 2px 12px;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    padding:60px 20px;
    font-size:14px;
    line-height:1.6;
  }

  /* 노선 칩 */
  .chip-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 14px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:700;
    border:1.5px solid transparent;
    cursor:pointer;
    color:#fff;
    white-space:nowrap;
    opacity:0.55;
    transition:opacity .15s ease, transform .15s ease;
  }
  .chip.active{
    opacity:1;
    transform:scale(1.04);
    box-shadow:0 2px 8px rgba(0,0,0,0.18);
  }
  .chip .dot{
    width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.85);
  }

  .line-note{
    font-size:12.5px;
    color:var(--sub);
    background:#eef0f2;
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:14px;
    line-height:1.5;
  }

  /* 역 카드 */
  .station-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .station-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px;
    text-decoration:none;
    color:var(--ink);
    border-left:5px solid var(--accent);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .station-card:active{
    transform:scale(0.98);
  }
  .station-card:hover{
    box-shadow:0 3px 10px rgba(0,0,0,0.06);
  }
  .station-info{
    flex:1;
    min-width:0;
  }
  .station-name-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:3px;
  }
  .station-name{
    font-size:16px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .line-badge{
    font-size:11px;
    font-weight:800;
    color:#fff;
    padding:2px 7px;
    border-radius:999px;
    flex:0 0 auto;
  }
  .station-addr{
    font-size:12.5px;
    color:var(--sub);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .station-phone{
    font-size:12.5px;
    color:var(--sub);
    margin-top:1px;
  }
  .call-btn{
    flex:0 0 auto;
    width:42px;
    height:42px;
    border-radius:50%;
    background:#1db954;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .call-btn svg{
    width:19px;
    height:19px;
    fill:#fff;
  }
  .result-count{
    font-size:12.5px;
    color:var(--sub);
    margin:0 2px 10px;
  }

  /* ---------- 접근성·신규 요소 ---------- */
  .sr-only{
    position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  button{font-family:inherit;}
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:3px solid #ffbf00;
    outline-offset:2px;
  }
  .search-box .clear{border:none;}

  /* 칩: 선택 안 된 칩도 글자 대비가 충분하도록 윤곽선 방식 */
  .chip{
    opacity:1;
    background:#fff;
    color:var(--ink);
    border:2px solid var(--c);
    font-family:inherit;
  }
  .chip .dot{background:var(--c);}
  .chip.active{
    background:var(--c);
    color:var(--t);
    transform:none;
  }
  .chip.active .dot{background:var(--t);}
  .group-label{
    font-size:12px;
    font-weight:700;
    color:var(--sub);
    margin:2px 2px 6px;
  }
  .chip-row.region{padding-bottom:6px;}
  .chip-row.region .chip{--c:#1b2028;--t:#fff;}

  .rep-tag{
    display:inline-block;
    margin-top:4px;
    font-size:11.5px;
    font-weight:700;
    color:#7c2d12;
    background:#ffedd5;
    border-radius:6px;
    padding:2px 7px;
  }
  .station-card.nophone{
    cursor:default;
  }
  .station-card.nophone .station-phone{
    color:#9a3412;
    font-weight:700;
  }
  .src{
    font-size:12px;
    color:var(--sub);
    line-height:1.6;
    padding:0 18px 28px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>지하철역 전화걸기</h1>
    <p>역명을 검색하거나 노선을 선택해서 바로 전화하세요</p>
    <div class="tabs" role="tablist" aria-label="보기 방식">
      <button class="tab-btn active" role="tab" id="tab-search" aria-selected="true" aria-controls="panel-search" data-tab="search">역 검색</button>
      <button class="tab-btn" role="tab" id="tab-line" aria-selected="false" aria-controls="panel-line" data-tab="line">노선별 보기</button>
    </div>
  </header>

  <main>
    <!-- 검색 패널 -->
    <section class="panel active" id="panel-search" role="tabpanel" aria-labelledby="tab-search">
      <div class="search-box">
        <label for="searchInput" class="sr-only">역 이름 검색</label>
        <input type="text" id="searchInput" placeholder="역명 또는 초성 (예: 강남, 서울역, ㅌㄱㅇ)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button class="clear" id="clearBtn" type="button" aria-label="검색어 지우기">✕</button>
      </div>
      <div id="searchResultCount" class="result-count" role="status" aria-live="polite" style="display:none;"></div>
      <div id="searchResults"></div>
    </section>

    <!-- 노선별 패널 -->
    <section class="panel" id="panel-line" role="tabpanel" aria-labelledby="tab-line" hidden>
      <div class="group-label" id="regionLabel">지역</div>
      <div class="chip-row region" id="regionRow" role="group" aria-labelledby="regionLabel"></div>
      <div class="group-label" id="lineLabel">노선</div>
      <div class="chip-row" id="chipRow" role="group" aria-labelledby="lineLabel"></div>
      <div class="line-note">역 목록은 <b>가나다순</b>으로 정렬되어 있습니다. 여러 노선이 지나는 환승역은 각 노선에 모두 나옵니다.</div>
      <div id="lineResultCount" class="result-count" role="status" aria-live="polite" style="display:none;"></div>
      <div id="lineResults" class="station-list"></div>
    </section>
  </main>

  <p class="src">
    자료: 국가철도공단 전국도시철도역사정보 (2026-06-30 기준).<br>
    '대표번호'로 표시된 역은 자료에 역 직통 번호가 없어 운영기관 고객센터 번호가 연결됩니다.
  </p>
</div>

function textOn(hex){
  const c = hex.replace('#','');
  const ch = i => { const v = parseInt(c.substr(i,2),16)/255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055,2.4); };
  const L = 0.2126*ch(0) + 0.7152*ch(2) + 0.0722*ch(4);
  return (1.05/(L+0.05)) >= ((L+0.05)/0.06) ? '#ffffff' : '#101418';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function telHref(phone){ return 'tel:' + phone.replace(/[^0-9]/g,''); }
function spokenName(s){ return s.n.includes('(') ? s.n : s.n + '역'; }
function baseName(n){ return n.replace(/\(.*?\)/g,'').trim(); }

function stationCardHTML(s){
  const color = LINE_COLOR[s.l] || '#555';
  const text = textOn(color);
  const badge = `<span class="line-badge" style="background:${color};color:${text}">${esc(s.l)}</span>`;
  const head = `
      <div class="station-info">
        <div class="station-name-row">
          <span class="station-name">${esc(s.n)}</span>
          ${badge}
        </div>
        <div class="station-addr">${esc(s.a)}</div>`;

  if(s.t === 'x'){
    return `
    <div class="station-card nophone" style="border-left-color:${color}" role="group" aria-label="${esc(spokenName(s))} ${esc(s.l)}, 전화번호 정보 없음">
      ${head}
        <div class="station-phone">전화번호 정보 없음</div>
      </div>
    </div>`;
  }
  const rep = s.t === 'r';
  const label = `${spokenName(s)} ${s.l} 전화 걸기. ${rep ? s.o + ' 대표번호, 역 직통 번호가 아닙니다. ' : ''}${s.p}`;
  return `
    <a class="station-card" href="${telHref(s.p)}" style="border-left-color:${color}" aria-label="${esc(label)}">
      ${head}
        <div class="station-phone">${esc(s.p)}</div>
        ${rep ? `<div class="rep-tag">${esc(s.o)} 대표번호 · 역 직통 아님</div>` : ''}
      </div>
      <div class="call-btn">${CALL_ICON}</div>
    </a>`;
}

const tabBtns = document.querySelectorAll('.tab-btn');
tabBtns.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    tabBtns.forEach(b=>{ b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-selected','true');
    document.querySelectorAll('.panel').forEach(p=>{ p.classList.remove('active'); p.hidden = true; });
    const panel = document.getElementById('panel-' + btn.dataset.tab);
    panel.classList.add('active');
    panel.hidden = false;
  });
});

const clearBtn = document.getElementById('clearBtn');
const MAX_RESULTS = 120;

// 한글 초성 추출 (예: "퇴계원" -> "ㅌㄱㅇ")
const CHOSUNG_LIST = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function getChosung(str){
  let result = '';
  for(const ch of str){
    const code = ch.charCodeAt(0);
    if(code >= 0xAC00 && code <= 0xD7A3){
      result += CHOSUNG_LIST[Math.floor((code - 0xAC00) / (21 * 28))];
    } else {
      result += ch;
    }
  }
  return result;
}
function isChosungOnly(str){ return /^[ㄱ-ㅎ]+$/.test(str); }

// 검색용 색인 (역명 · 괄호 안 이름 · 예전 역명 · 초성)
const INDEX = STATIONS.map(s => {
  const names = [s.n, ...(s.k || [])];
  return { s, names, base: baseName(s.n), chosung: getChosung(baseName(s.n)) };
});

// 한 단어(token)가 역에 얼마나 잘 맞는지 점수 반환 (낮을수록 좋음, 안 맞으면 null)
function scoreToken(it, tok){
  if(isChosungOnly(tok)){
    if(it.chosung === tok) return 0;
    if(it.chosung.startsWith(tok)) return 1;
    return it.chosung.includes(tok) ? 2 : null;
  }
  let t = tok;
  if(t.length > 1 && t.endsWith('역')) t = t.slice(0,-1);
  let best = null;
  const upd = v => { if(best === null || v < best) best = v; };
  if(it.base === t) upd(0);
  for(const nm of it.names){
    if(nm === t || baseName(nm) === t) upd(0);
    else if(baseName(nm).startsWith(t)) upd(1);
    else if(nm.includes(t)) upd(2);
  }
  return best;
}
// 노선 이름이 단어와 맞는지 ("2호선", "경춘")
function lineMatches(it, tok){
  return it.s.l.includes(tok);
}

function runSearch(q){
  const tokens = q.split(/\s+/).filter(Boolean);
  const out = [];
  for(const it of INDEX){
    let total = 0, ok = true;
    for(const tok of tokens){
      const sc = scoreToken(it, tok);
      if(sc !== null){ total += sc; }
      else if(tokens.length > 1 && lineMatches(it, tok)){ total += 0; }
      else { ok = false; break; }
    }
    if(ok) out.push({it, total});
  }
  out.sort((a,b)=> a.total - b.total
    || LINE_ORDER.indexOf(a.it.s.l) - LINE_ORDER.indexOf(b.it.s.l)
    || a.it.s.n.localeCompare(b.it.s.n,'ko'));
  return out.map(o=>o.it.s);
}

let countTimer = null;
function setCount(el, text){
  clearTimeout(countTimer);
  el.style.display = 'block';
  // 스크린리더가 글자마다 읽지 않도록 잠깐 기다렸다가 갱신
  countTimer = setTimeout(()=>{ el.textContent = text; }, 400);
}

function renderSearch(){
  const q = searchInput.value.trim();
  clearBtn.style.display = q ? 'block' : 'none';

  if(!q){
    searchResultCount.style.display = 'none';
    searchResultCount.textContent = '';
    searchResults.innerHTML = `<div class="empty">역 이름을 입력하면 결과가 여기에 나타납니다.<br>예: 강남, 서울역, ㅌㄱㅇ, 2호선 강남</div>`;
    return;
  }

  const matched = runSearch(q);
  if(matched.length === 0){
    setCount(searchResultCount, '검색결과 없음');
    searchResults.innerHTML = `<div class="empty">"${esc(q)}"(으)로 검색된 역이 없습니다.</div>`;
    return;
  }
  const shown = matched.slice(0, MAX_RESULTS);
  setCount(searchResultCount, matched.length > shown.length
    ? `검색결과 ${matched.length}건 중 ${shown.length}건 표시. 더 구체적으로 입력해 보세요.`
    : `검색결과 ${matched.length}건`);
  searchResults.innerHTML = `<div class="station-list">${shown.map(stationCardHTML).join('')}</div>`;
}
searchInput.addEventListener('input', renderSearch);
clearBtn.addEventListener('click', ()=>{ searchInput.value=''; renderSearch(); searchInput.focus(); });
renderSearch();

/* ---------- 노선별 ---------- */
const regionRow = document.getElementById('regionRow');
const chipRow = document.getElementById('chipRow');
const lineResults = document.getElementById('lineResults');
const lineResultCount = document.getElementById('lineResultCount');
let currentRegion = REGIONS[0];
let currentLine = REGIONS[0].lines[0];

function chipHTML(attr, value, label, color, active){
  return `<button type="button" class="chip${active ? ' active' : ''}" ${attr}="${esc(value)}" aria-pressed="${active}" style="--c:${color};--t:${textOn(color)}"><span class="dot" aria-hidden="true"></span>${esc(label)}</button>`;
}

function renderRegions(){
  regionRow.innerHTML = REGIONS.map(r => chipHTML('data-region', r.id, r.name, '#1b2028', r.id === currentRegion.id)).join('');
  regionRow.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      currentRegion = REGIONS.find(r => r.id === chip.dataset.region);
      currentLine = currentRegion.lines[0];
      renderRegions(); renderChips(); renderLineResults();
    });
  });
}

function renderChips(){
  chipRow.innerHTML = currentRegion.lines.map(l => chipHTML('data-line', l, l, LINE_COLOR[l], l === currentLine)).join('');
  chipRow.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      currentLine = chip.dataset.line;
      renderChips();
      renderLineResults();
    });
  });
}

function renderLineResults(){
  const list = STATIONS.filter(s => s.l === currentLine);
  lineResultCount.style.display = 'block';
  lineResultCount.textContent = `${currentLine} · 총 ${list.length}개 역`;
  lineResults.innerHTML = list.map(stationCardHTML).join('');
}

renderRegions();
renderChips();
renderLineResults();
</script>
