<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지하철역 전화걸기</title>
<style>
  :root{
    --ink:#1b1f24;
    --sub:#6b7280;
    --line:#e5e7eb;
    --bg:#f7f7f5;
    --card:#ffffff;
    --accent:#0052A4;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:28px 20px 16px;
    background:linear-gradient(180deg,#101418 0%,#1b2028 100%);
    color:#fff;
    position:sticky;
    top:0;
    z-index:10;
  }
  header h1{
    margin:0 0 4px;
    font-size:21px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  header p{
    margin:0;
    font-size:13px;
    color:#9aa3af;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-top:16px;
    background:rgba(255,255,255,0.08);
    padding:4px;
    border-radius:12px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:transparent;
    color:#c3c9d1;
    font-size:14px;
    font-weight:700;
    padding:10px 0;
    border-radius:9px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .tab-btn.active{
    background:#fff;
    color:#101418;
  }
  main{
    flex:1;
    padding:16px 16px 40px;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  /* 검색 패널 */
  .search-box{
    position:relative;
    margin-bottom:14px;
  }
  .search-box input{
    width:100%;
    padding:14px 44px 14px 16px;
    font-size:16px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:var(--card);
    outline:none;
    color:var(--ink);
  }
  .search-box input:focus{
    border-color:var(--accent);
  }
  .search-box .clear{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:#d8dadd;
    color:#fff;
    width:24px;
    height:24px;
    border-radius:50%;
    font-size:14px;
    line-height:24px;
    text-align:center;
    cursor:pointer;
    display:none;
  }
  .hint{
    font-size:13px;
    color:var(--sub);
    margin:0 2px 12px;
  }
  .empty{
    text-align:center;
    color:var(--sub);
    padding:60px 20px;
    font-size:14px;
    line-height:1.6;
  }

  /* 노선 칩 */
  .chip-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 14px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:700;
    border:1.5px solid transparent;
    cursor:pointer;
    color:#fff;
    white-space:nowrap;
    opacity:0.55;
    transition:opacity .15s ease, transform .15s ease;
  }
  .chip.active{
    opacity:1;
    transform:scale(1.04);
    box-shadow:0 2px 8px rgba(0,0,0,0.18);
  }
  .chip .dot{
    width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.85);
  }

  .line-note{
    font-size:12.5px;
    color:var(--sub);
    background:#eef0f2;
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:14px;
    line-height:1.5;
  }

  /* 역 카드 */
  .station-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .station-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px;
    text-decoration:none;
    color:var(--ink);
    border-left:5px solid var(--accent);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .station-card:active{
    transform:scale(0.98);
  }
  .station-card:hover{
    box-shadow:0 3px 10px rgba(0,0,0,0.06);
  }
  .station-info{
    flex:1;
    min-width:0;
  }
  .station-name-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:3px;
  }
  .station-name{
    font-size:16px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .line-badge{
    font-size:11px;
    font-weight:800;
    color:#fff;
    padding:2px 7px;
    border-radius:999px;
    flex:0 0 auto;
  }
  .station-addr{
    font-size:12.5px;
    color:var(--sub);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .station-phone{
    font-size:12.5px;
    color:var(--sub);
    margin-top:1px;
  }
  .call-btn{
    flex:0 0 auto;
    width:42px;
    height:42px;
    border-radius:50%;
    background:#1db954;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .call-btn svg{
    width:19px;
    height:19px;
    fill:#fff;
  }
  .result-count{
    font-size:12.5px;
    color:var(--sub);
    margin:0 2px 10px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>지하철역 전화걸기</h1>
    <p>역명을 검색하거나 노선을 선택해서 바로 전화하세요</p>
    <div class="tabs">
      <button class="tab-btn active" data-tab="search">역 검색</button>
      <button class="tab-btn" data-tab="line">노선별 보기</button>
    </div>
  </header>

  <main>
    <!-- 검색 패널 -->
    <section class="panel active" id="panel-search">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="역명 또는 초성 (예: 강남, 서울역, ㅌㄱㅇ)" autocomplete="off">
        <button class="clear" id="clearBtn">✕</button>
      </div>
      <div id="searchResultCount" class="result-count" style="display:none;"></div>
      <div id="searchResults"></div>
    </section>

    <!-- 노선별 패널 -->
    <section class="panel" id="panel-line">
      <div class="chip-row" id="chipRow"></div>
      <div class="line-note">역 목록은 원본 자료에 노선 순서 정보가 없어 <b>가나다순</b>으로 정렬되어 있습니다.</div>
      <div id="lineResultCount" class="result-count" style="display:none;"></div>
      <div id="lineResults" class="station-list"></div>
    </section>
  </main>
</div>

  '9':          { name:'9호선',      color:'#B5A26A', text:'#fff' },
  '분당선':      { name:'분당선',     color:'#F5A200', text:'#fff' },
  '신분당선':    { name:'신분당선',   color:'#D31145', text:'#fff' },
  '경의선':      { name:'경의선',     color:'#5CA88A', text:'#fff' },
  '중앙선':      { name:'중앙선',     color:'#4E8F63', text:'#fff' },
  '경춘선':      { name:'경춘선',     color:'#0C8E72', text:'#fff' },
  '수인선':      { name:'수인선',     color:'#FBB03B', text:'#fff' },
  '공항철도':    { name:'공항철도',   color:'#0090D2', text:'#fff' },
  '인천1':      { name:'인천1호선',  color:'#7CA8D5', text:'#fff' },
};
const LINE_ORDER = ['1','2','3','4','5','6','7','8','9','분당선','신분당선','경의선','중앙선','경춘선','수인선','공항철도','인천1'];

function telHref(phone){
  return 'tel:' + phone.replace(/[^0-9]/g,'');
}

function stationCardHTML(s){
  const meta = LINE_META[s.l] || { name:s.l, color:'#555' };
  return `
    <a class="station-card" href="${telHref(s.p)}" style="border-left-color:${meta.color}">
      <div class="station-info">
        <div class="station-name-row">
          <span class="station-name">${s.n}</span>
          <span class="line-badge" style="background:${meta.color}">${meta.name}</span>
        </div>
        <div class="station-addr">${s.a}</div>
        <div class="station-phone">${s.p}</div>
      </div>
      <div class="call-btn">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.46.57 3.58a1 1 0 0 1-.25 1.01l-2.2 2.2z"/></svg>
      </div>
    </a>
  `;
}

/* ---------- 탭 전환 ---------- */
const tabBtns = document.querySelectorAll('.tab-btn');
tabBtns.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    tabBtns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

/* ---------- 검색 ---------- */
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchResultCount = document.getElementById('searchResultCount');
const clearBtn = document.getElementById('clearBtn');

// 한글 초성 추출 (예: "퇴계원" -> "ㅌㄱㅇ")
const CHOSUNG_LIST = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function getChosung(str){
  let result = '';
  for(const ch of str){
    const code = ch.charCodeAt(0);
    if(code >= 0xAC00 && code <= 0xD7A3){
      result += CHOSUNG_LIST[Math.floor((code - 0xAC00) / (21 * 28))];
    } else {
      result += ch;
    }
  }
  return result;
}
function isChosungOnly(str){
  return /^[ㄱ-ㅎ]+$/.test(str);
}

// 원본 데이터는 역명 끝의 "역" 글자가 빠져있음 (예: "서울역"이 아니라 "서울").
// 사용자가 역명, "역"을 붙인 이름, 초성 중 어떤 걸 입력해도 찾을 수 있게 한다.
function matchStation(s, q, qNoYeok, chosungMode){
  if(chosungMode){
    return getChosung(s.n).includes(q);
  }
  return s.n.includes(q) || (qNoYeok && s.n.includes(qNoYeok)) || (s.n + '역').includes(q);
}

function renderSearch(){
  const q = searchInput.value.trim();
  clearBtn.style.display = q ? 'block' : 'none';

  if(!q){
    searchResultCount.style.display = 'none';
    searchResults.innerHTML = `<div class="empty">역 이름을 입력하면 결과가 여기에 나타납니다.<br>예: 강남, 서울역, ㅌㄱㅇ</div>`;
    return;
  }

  const chosungMode = isChosungOnly(q);
  const qNoYeok = (!chosungMode && q.length > 1 && q.endsWith('역')) ? q.slice(0, -1) : '';
  const matched = STATIONS.filter(s => matchStation(s, q, qNoYeok, chosungMode));
  searchResultCount.style.display = 'block';
  searchResultCount.textContent = `검색결과 ${matched.length}건`;

  if(matched.length === 0){
    searchResults.innerHTML = `<div class="empty">"${q}"(으)로 검색된 역이 없습니다.</div>`;
    return;
  }

  searchResults.innerHTML = `<div class="station-list">${matched.map(stationCardHTML).join('')}</div>`;
}
searchInput.addEventListener('input', renderSearch);
clearBtn.addEventListener('click', ()=>{ searchInput.value=''; renderSearch(); searchInput.focus(); });
renderSearch();

/* ---------- 노선별 ---------- */
const chipRow = document.getElementById('chipRow');
const lineResults = document.getElementById('lineResults');
const lineResultCount = document.getElementById('lineResultCount');
let currentLine = LINE_ORDER[0];

function renderChips(){
  chipRow.innerHTML = LINE_ORDER.map(l=>{
    const meta = LINE_META[l];
    const active = l === currentLine ? 'active' : '';
    return `<div class="chip ${active}" data-line="${l}" style="background:${meta.color}">
      <span class="dot"></span>${meta.name}
    </div>`;
  }).join('');

  chipRow.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      currentLine = chip.dataset.line;
      renderChips();
      renderLineResults();
    });
  });
}

function renderLineResults(){
  const list = STATIONS.filter(s => s.l === currentLine);
  lineResultCount.style.display = 'block';
  lineResultCount.textContent = `${LINE_META[currentLine].name} · 총 ${list.length}개 역`;
  lineResults.innerHTML = list.map(stationCardHTML).join('');
}

renderChips();
renderLineResults();
</script>
